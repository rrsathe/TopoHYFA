[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "topohyfa"
version = "0.2.0"
description = "Topology-aware hypergraph factorization for multi-tissue gene expression imputation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["hypergraph", "matrix-factorization", "gene-expression", "imputation", "bioinformatics", "machine-learning"]
authors = [
    { name = "HYFA Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core ML
    "torch==2.3.0",

    # PyTorch Geometric ecosystem
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",

    # Scientific computing
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "statsmodels==0.14.6",

    # Single-cell / bioinformatics
    "anndata==0.11.4",
    "scanpy==1.10.1",
    "biopython==1.87",
    "bioservices==1.11.2",
    "lxml==6.1.1",
    "gseapy==1.2.1",
    "blitzgsea",

    # Visualization
    "matplotlib==3.9.0",
    "supervenn==0.5.0",
    "umap-learn==0.5.7",

    # Utilities
    "h5py==3.16.0",
    "missingpy==0.2.0",
    "nbformat==5.10.4",
    "networkx==3.4.2",
    "pyyaml==6.0.3",
    "scikit-misc==0.5.2",
    "tqdm==4.67.3",
    "wandb==0.26.1",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-cov==7.1.0",
    "ruff==0.15.12",
    "ty==0.0.54",
    "pre-commit==4.6.0",
    "deptry==0.25.1",
    "pip-audit==2.10.1",

    # Typing stubs
    "types-networkx==3.6.1.20260408",
    "types-pyyaml==6.0.12.20260408",
    "pandas-stubs==2.3.3.260113",
    "types-seaborn==0.13.2.20260408",
    "scipy-stubs==1.15.3.0",
    "types-tqdm==4.67.3.20260408",
    "scikit-learn-stubs==0.0.3",
]

[project.urls]
Homepage = "https://github.com/rrsathe/TopoHYFA"
Repository = "https://github.com/rrsathe/TopoHYFA"
Documentation = "https://github.com/rrsathe/TopoHYFA#readme"
Issues = "https://github.com/rrsathe/TopoHYFA/issues"

[project.scripts]
train-hyfa = "train_gtex:main"

# ---------------------------------------------------------
# setuptools configuration
# ---------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------
# uv configuration
# ---------------------------------------------------------

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.3.0+cpu.html"
]

[tool.uv.sources]
blitzgsea = { git = "https://github.com/MaayanLab/blitzgsea.git", rev = "de42814395a6cde8404f164b5bff7adbf5df6bbc" }

torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
    "extracted_hd",
    "hd_case_study/01b_mine_metadata.py",
    "hd_case_study/02a_gtex_cortex_recoverability.py",
    "hd_case_study/02b_blood_labels.py",
    "hd_case_study/05_grn_lcc.py",
    "hd_case_study/06a_grn_model_cortex.py",
    "hd_case_study/06b_classify.py",
    "hd_case_study/06b_impute_ba9_from_blood.py",
    "hd_case_study/06c_gene_coverage.py",
    "hd_case_study/06d_imputation_diagnostic.py",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "PT",   # pytest-style rules
    "PLE",  # Pylint errors
]

ignore = ["E501"]  # Line length warning disabled as long lines are manually handled

[tool.ruff.lint.flake8-pytest-style]
fixture-parentheses = false

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------
# Pytest
# ---------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -v"

# ---------------------------------------------------------
# Coverage
# ---------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------
# ty
# ---------------------------------------------------------

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = ["**/*.ipynb", "src/train_utils.py"]

[tool.ty.analysis]
replace-imports-with-any = [
    "torch.**",
    "torch_scatter.**",
    "torch_sparse.**",
    "anndata.**",
    "scanpy.**",
    "supervenn.**",
    "umap.**",
    "missingpy.**",
]

[tool.ty.rules]
redundant-cast = "ignore"

# ---------------------------------------------------------
# deptry
# ---------------------------------------------------------

[tool.deptry]
exclude = [
    ".venv",
    "data",
    "results",
    "notebooks",
    "fig",
    ".git",
    ".ruff_cache",
    ".pytest_cache"
]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "wandb",
    "supervenn",
    "umap-learn",
    "nbformat",
    "missingpy",
    "scikit-misc",
    "torch-sparse",
    "statsmodels",
    "anndata",
    "bioservices",
    "lxml",
    "gseapy",
    "h5py"
]
DEP003 = [
    "rich",
    "seaborn",
]
DEP004 = [
    "pytest",   # correctly used only in tests/
]

[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "topohyfa"
version = "0.1.0"
description = "Hypergraph Factorization for multi-tissue gene expression imputation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
keywords = ["hypergraph", "matrix-factorization", "gene-expression", "imputation", "bioinformatics", "machine-learning"]
authors = [
    { name = "HYFA Team" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
]

dependencies = [
    # Core ML
    "torch==2.3.0",

    # PyTorch Geometric ecosystem
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",

    # Scientific computing
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "statsmodels",

    # Single-cell / bioinformatics
    "anndata==0.11.4",
    "scanpy==1.10.1",
    "biopython",
    "bioservices",
    "lxml>=6.1.0",
    "gseapy",
    "blitzgsea",

    # Visualization
    "matplotlib==3.9.0",
    "supervenn",
    "umap-learn==0.5.7",

    # Utilities
    "h5py",
    "missingpy",
    "nbformat",
    "networkx==3.4.2",
    "pyyaml",
    "scikit-misc",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "ty",
    "pre-commit",
    "deptry",
    "pip-audit",

    # Typing stubs
    "types-networkx",
    "types-PyYAML",
    "pandas-stubs",
    "types-seaborn",
    "scipy-stubs",
    "types-tqdm",
    "scikit-learn-stubs",
]

[project.urls]
Homepage = "https://github.com/rrsathe/TopoHYFA"
Repository = "https://github.com/rrsathe/TopoHYFA"
Documentation = "https://github.com/rrsathe/TopoHYFA#readme"
Issues = "https://github.com/rrsathe/TopoHYFA/issues"

[project.scripts]
train-hyfa = "train_gtex:main"

# ---------------------------------------------------------
# setuptools configuration
# ---------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------
# uv configuration
# ---------------------------------------------------------

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.3.0+cpu.html"
]

[tool.uv.sources]
blitzgsea = { git = "https://github.com/MaayanLab/blitzgsea.git" }

torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "B",    # flake8-bugbear
    "I",    # isort
    "UP",   # pyupgrade
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "A",    # flake8-builtins
    "PT",   # pytest-style rules
    "PLE",  # Pylint errors
]

ignore = ["E501"]  # Line length warning disabled as long lines are manually handled

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ---------------------------------------------------------
# Pytest
# ---------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers -v"

# ---------------------------------------------------------
# Coverage
# ---------------------------------------------------------

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
skip_covered = true
skip_empty = true
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

[tool.coverage.html]
directory = "htmlcov"

# ---------------------------------------------------------
# ty
# ---------------------------------------------------------

[tool.ty.src]
include = ["src", "tests", "scripts"]
exclude = ["**/*.ipynb", "src/train_utils.py"]

[tool.ty.analysis]
replace-imports-with-any = [
    "torch.**",
    "torch_scatter.**",
    "torch_sparse.**",
    "anndata.**",
    "scanpy.**",
    "supervenn.**",
    "umap.**",
    "missingpy.**",
]

[tool.ty.rules]
redundant-cast = "ignore"

# ---------------------------------------------------------
# deptry
# ---------------------------------------------------------

[tool.deptry]
exclude = [
    ".venv",
    "data",
    "results",
    "notebooks",
    "fig",
    ".git",
    ".ruff_cache",
    ".pytest_cache"
]
optional_dependencies_dev_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP002 = [
    "wandb",
    "supervenn",
    "umap-learn",
    "nbformat",
    "missingpy",
    "scikit-misc",
    "torch-sparse",
    "statsmodels",
    "anndata",
    "bioservices",
    "lxml",
    "gseapy",
    "h5py"
]
DEP003 = [
    "rich",
    "seaborn"
]

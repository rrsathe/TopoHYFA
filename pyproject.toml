[build-system]
requires = [
    "setuptools>=61.0.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "topohyfa"
version = "0.1.0"
description = "Hypergraph Factorization for multi-tissue gene expression imputation"
readme = "README.md"
requires-python = ">=3.10,<3.12"

authors = [
    { name = "HYFA Team" }
]

dependencies = [
    # Core ML
    "torch==2.3.0",

    # PyTorch Geometric ecosystem
    "torch-scatter==2.1.2",
    "torch-sparse==0.6.18",

    # Scientific computing
    "numpy==1.26.4",
    "scipy==1.13.1",
    "pandas==2.2.2",
    "scikit-learn==1.5.0",
    "statsmodels",

    # Single-cell / bioinformatics
    "anndata==0.11.4",
    "scanpy==1.10.1",
    "biopython",
    "bioservices",
    "gseapy",
    "blitzgsea",

    # Visualization
    "matplotlib==3.9.0",
    "supervenn",
    "umap-learn==0.5.7",

    # Utilities
    "h5py",
    "missingpy",
    "nbformat",
    "networkx==3.4.2",
    "pyyaml",
    "scikit-misc",
    "tqdm",
    "wandb",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",

    # Typing stubs
    "types-networkx",
    "types-PyYAML",
    "pandas-stubs",
    "types-seaborn",
    "scipy-stubs",
    "types-tqdm",
    "scikit-learn-stubs",
]

[project.scripts]
train-hyfa = "train_gtex:main"

# ---------------------------------------------------------
# setuptools configuration
# ---------------------------------------------------------

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

# ---------------------------------------------------------
# uv configuration
# ---------------------------------------------------------

[tool.uv]
find-links = [
    "https://data.pyg.org/whl/torch-2.3.0+cpu.html"
]

[tool.uv.sources]
blitzgsea = { git = "https://github.com/MaayanLab/blitzgsea.git" }

torch = [
    { index = "pytorch-cpu" }
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------
# Ruff
# ---------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "C4",
    "SIM",
]

ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

# ---------------------------------------------------------
# Pytest
# ---------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------
# ty
# ---------------------------------------------------------

[tool.ty.src]
exclude = ["**/*.ipynb"]

# ---------------------------------------------------------
# mypy
# ---------------------------------------------------------

[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "anndata.*",
    "scanpy.*",
    "wandb.*",
    "torch_scatter.*",
    "torch_sparse.*",
    "bioservices.*",
    "gseapy.*",
    "blitzgsea.*",
    "missingpy.*",
    "supervenn.*",
    "umap.*",
]
ignore_missing_imports = true
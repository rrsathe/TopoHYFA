[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "topohyfa"
version = "0.1.0"
description = "Hypergraph Factorization for multi-tissue gene expression imputation"
readme = "README.md"
requires-python = ">=3.10,<3.12"
authors = [{ name = "HYFA Team" }]
license = { text = "MIT" }
dependencies = [
    "torch==2.3.0",
    "torch-scatter",
    "torch-sparse",
    "anndata",
    "biopython",
    "bioservices",
    "gseapy",
    "h5py",
    "matplotlib==3.9.0",
    "missingpy",
    "nbformat",
    "networkx",
    "numpy==1.26.4",
    "pandas==2.2.2",
    "pyyaml",
    "scanpy==1.10.1",
    "scikit-learn==1.5.0",
    "scikit-misc",
    "scipy==1.13.1",
    "statsmodels",
    "supervenn",
    "tqdm",
    "types-networkx",
    "umap-learn",
    "wandb",
    "blitzgsea",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
    "types-PyYAML",
    "pandas-stubs",
    "types-seaborn",
    "scipy-stubs",
    "types-tqdm",
    "scikit-learn-stubs",
]

[project.scripts]
# Adjust the entry point depending on your actual module structure
train-hyfa = "train_gtex:main"

[tool.setuptools.packages.find]
include = ["src*"]

# ---------------------------------------------------------
# uv-specific configurations
# ---------------------------------------------------------
[tool.uv]
# PyG doesn't use a standard PEP 503 index, so we still need find-links for torch-scatter/sparse
find-links = ["https://data.pyg.org/whl/torch-2.3.0+cpu.html"]

[tool.uv.sources]
blitzgsea = { git = "https://github.com/MaayanLab/blitzgsea.git" }
# Tell uv explicitly to fetch PyTorch from the custom index below
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
# The official PyTorch CPU index (PEP 503 compliant)
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# ---------------------------------------------------------
# Linting & Formatting (Ruff)
# ---------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
combine-as-imports = true

# ---------------------------------------------------------
# Testing (Pytest)
# ---------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# ---------------------------------------------------------
# Type Checking (ty)
# ---------------------------------------------------------
[tool.ty.src]
exclude = ["**/*.ipynb"]

# ---------------------------------------------------------
# Type Checking (Mypy)
# ---------------------------------------------------------
[tool.mypy]
python_version = "3.10"
check_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
# Ignore missing imports for heavy scientific/ML libraries without stubs
module = [
    "anndata.*",
    "scanpy.*",
    "wandb.*",
    "torch_scatter.*",
    "torch_sparse.*",
    "bioservices.*",
    "gseapy.*",
    "blitzgsea.*",
    "missingpy.*",
    "supervenn.*",
    "umap.*",
]
ignore_missing_imports = true

name: Clean Build Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  clean-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (Clean checkout)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          clean: true

      - name: Set up Python 3.10.16 (No caching)
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.10.16"

      - name: Install uv (No caching)
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: false

      - name: Clean install dependencies (from scratch)
        run: |
          uv sync --frozen --locked

      - name: Build Docker image with --no-cache
        run: |
          docker build --no-cache -t topohyfa:latest .

      - name: Execute Container Smoke Test
        run: |
          docker run --rm topohyfa:latest python -c "from src.data import Data; print('[OK] Clean build smoke test verified')"

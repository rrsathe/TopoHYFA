name: Reproducibility & CI Verification

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.10.16
        uses: actions/setup-python@f67e240f2d7c354b525b27ceb36563b03e44637d # v5.3.0
        with:
          python-version: "3.10.16"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.24"
          enable-cache: true

      - name: Verify uv.lock is up-to-date and install dependencies
        run: |
          uv sync --frozen --locked

      - name: Run Ruff Format check
        run: |
          uv run ruff format --check .

      - name: Run Ruff Linter check
        run: |
          uv run ruff check .

      - name: Run Static Type Checking (ty)
        run: |
          uv run ty check

      - name: Run Pytest & Code Coverage
        run: |
          uv run pytest --cov=src --cov-report=term-missing --cov-branch

      - name: Run Dependency Audit (deptry)
        run: |
          uv run deptry .

      - name: Run Security Audit (pip-audit)
        run: |
          uv run pip-audit

      - name: Build Production Docker Image
        run: |
          docker build --no-cache -t topohyfa:latest .

      - name: Execute Container Smoke Test
        run: |
          docker run --rm topohyfa:latest python -c "from src.data import Data; print('[OK] Docker imports verified')"
